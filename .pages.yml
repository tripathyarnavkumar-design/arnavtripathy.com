# Website admin (Pages CMS): https://app.pagescms.org
# Every Save here commits to GitHub; the site rebuilds and goes live in about a minute.


media:
  input: media
  output: /media
  rename: safe
content:
- name: projects
  label: Design projects
  type: collection
  path: content/projects
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    primary: title
    fields:
    - title
    - order
    - categories
    sort: order
    order: asc
  fields:
  - name: title
    label: Project title
    type: string
    required: true
    description: The page address comes from the file name, created from the title when you first save.
  - name: order
    label: Position on the Design page
    type: number
    description: 1 appears first. Projects with the same number sort alphabetically.
  - name: categories
    label: Categories
    type: select
    options:
      multiple: true
      values:
      - name: uiux
        label: UI/UX
      - name: data
        label: Data Visualization
      - name: logo
        label: Logo Design
      - name: pub
        label: Publication Design
      - name: event
        label: Event Branding
  - name: description
    label: Short description
    type: text
    description: Shown under the project title. Leave a blank line between paragraphs.
  - name: prototype
    label: Prototype link
    type: string
    description: Optional. Shows an “Open the prototype” button.
  - name: timeline
    label: Timeline
    type: string
  - name: role
    label: Role
    type: string
  - name: tools
    label: Tools
    type: string
    description: Software used, e.g. Figma, Adobe Illustrator.
  - name: thumbnail
    label: Card image on the Design page
    type: image
    description: Optional. If empty, the first project image is used.
  - name: thumbnail_position
    label: Card image focus point
    type: select
    description: Which part of the image stays in view when the frame crops it.
    options:
      values:
      - name: ''
        label: Centre (default)
      - name: top
        label: Top
      - name: bottom
        label: Bottom
      - name: left
        label: Left
      - name: right
        label: Right
      - name: top left
        label: Top left
      - name: top right
        label: Top right
      - name: bottom left
        label: Bottom left
      - name: bottom right
        label: Bottom right
  - name: thumbnail_zoom
    label: Zoom
    type: select
    description: Enlarges the image inside its frame, cropping in towards the focus point.
    options:
      values:
      - name: 100%
        label: 100% (none)
      - name: 110%
        label: 110%
      - name: 125%
        label: 125%
      - name: 150%
        label: 150%
      - name: 175%
        label: 175%
      - name: 200%
        label: 200%
  - name: sections
    label: Text sections
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{heading}'
    fields:
    - name: heading
      label: Heading
      type: string
    - name: text
      label: Text
      type: text
      description: Leave a blank line between paragraphs. **bold** and *italic* work.
    - name: prompt
      label: Note to self (not shown on the website)
      type: string
    - name: hidden
      label: Hide on the website
      type: boolean
      description: Keeps this item saved here but removes it from the site.
  - name: gallery_heading
    label: Heading above the images
    type: string
    description: Shown only when the project has images.
  - name: images
    label: Project images
    type: object
    list:
      collapsible:
        collapsed: true
        summary: 'Image {index}: {caption}'
    fields:
    - name: image
      label: Image
      type: image
    - name: position
      label: Focus point
      type: select
      description: Only matters with Zoom above 100%, or when this image becomes the Design page card.
      options:
        values:
        - name: ''
          label: Centre (default)
        - name: top
          label: Top
        - name: bottom
          label: Bottom
        - name: left
          label: Left
        - name: right
          label: Right
        - name: top left
          label: Top left
        - name: top right
          label: Top right
        - name: bottom left
          label: Bottom left
        - name: bottom right
          label: Bottom right
    - name: zoom
      label: Zoom
      type: select
      description: Enlarges the image inside its frame, cropping in towards the focus point.
      options:
        values:
        - name: 100%
          label: 100% (none)
        - name: 110%
          label: 110%
        - name: 125%
          label: 125%
        - name: 150%
          label: 150%
        - name: 175%
          label: 175%
        - name: 200%
          label: 200%
    - name: caption
      label: Caption
      type: string
    - name: hidden
      label: Hide on the website
      type: boolean
      description: Keeps this item saved here but removes it from the site.
    description: Add as many as you like, in the order they should appear. They arrange themselves on the page; captions are optional.
  - name: hidden
    label: Hide this project from the website
    type: boolean
- name: research
  label: Research
  type: file
  path: content/research.yml
  format: yaml
  fields:
  - name: journal
    label: Journal publications (newest first)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{year} · {title}'
    fields:
    - name: authors
      label: Authors
      type: string
      description: e.g. Tripathy, A. K., & Dey, S.
    - name: year
      label: Year
      type: string
    - name: title
      label: Title
      type: string
    - name: journal
      label: Journal
      type: string
    - name: volume
      label: Volume
      type: string
    - name: issue
      label: Issue
      type: string
    - name: pages
      label: Pages
      type: string
      description: e.g. 298–315
    - name: doi
      label: DOI
      type: string
      description: Only the DOI, e.g. 10.1080/15551393.2026.2669476. Adds the link and the Cite button.
    - name: publisher
      label: Publisher
      type: string
    - name: impact_factor
      label: Impact factor
      type: string
    - name: quartile
      label: Quartile
      type: string
      description: e.g. Q1 (2025)
    - name: indexing
      label: Indexing
      type: string
    - name: hidden
      label: Hide on the website
      type: boolean
      description: Keeps this item saved here but removes it from the site.
  - name: conference
    label: Conference publications (newest first)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{year} · {title}'
    fields:
    - name: authors
      label: Authors
      type: string
    - name: year
      label: Year
      type: string
    - name: title
      label: Title
      type: string
    - name: editors
      label: Editors
      type: string
      description: Optional, e.g. A. Chakrabarti & V. Singh
    - name: venue
      label: Book or conference
      type: string
      description: Shown in italics.
    - name: details
      label: Details after the book or conference
      type: string
      description: Optional, e.g. Vol. 2. ICoRD 2025 (pp. 55–67). Springer
    - name: status
      label: Status
      type: string
      description: Optional, e.g. Accepted
    - name: doi
      label: DOI
      type: string
    - name: citation_book_title
      label: Book title for citations
      type: string
      description: Optional. Used by the Cite button; defaults to Book or conference.
    - name: publisher
      label: Publisher (for citations)
      type: string
    - name: pages
      label: Pages (for citations)
      type: string
    - name: hidden
      label: Hide on the website
      type: boolean
      description: Keeps this item saved here but removes it from the site.
  - name: presentations
    label: Conference presentations (newest first)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Title of the talk
      type: string
    - name: event
      label: Conference
      place and dates: null
      type: string
    - name: hidden
      label: Hide on the website
      type: boolean
      description: Keeps this item saved here but removes it from the site.
- name: teaching
  label: Teaching
  type: file
  path: content/teaching.yml
  format: yaml
  fields:
  - name: positions
    label: Teaching positions (newest first)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Role
      type: string
    - name: place
      label: Institution
      type: string
    - name: dates
      label: Dates
      type: string
    - name: intro
      label: Introduction
      type: text
    - name: groups
      label: Course groups
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
      fields:
      - name: label
        label: Group heading
        type: string
        description: Optional, e.g. Course Taught
      - name: courses
        label: Courses
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{code} {title}'
        fields:
        - name: code
          label: Course code
          type: string
        - name: title
          label: Course title
          type: string
        - name: info
          label: Credits and level
          type: string
          description: e.g. 3 Credits · UG & PG (Elective Course, Class strength 20)
        - name: points
          label: Points
          type: text
          list: true
        - name: hidden
          label: Hide on the website
          type: boolean
          description: Keeps this item saved here but removes it from the site.
      - name: hidden
        label: Hide on the website
        type: boolean
        description: Keeps this item saved here but removes it from the site.
    - name: hidden
      label: Hide on the website
      type: boolean
      description: Keeps this item saved here but removes it from the site.
