- name: home
  label: Home page
  type: file
  path: content/home.yml
  format: yaml
  fields:
  - name: practice
    label: Practice areas
    type: string
    list: true
  - name: lead
    label: Opening line
    type: string
  - name: about
    label: About paragraph
    type: text
- name: site
  label: Site settings
  type: file
  path: content/site.yml
  format: yaml
  fields:
  - name: name
    label: Your name
    type: string
  - name: email
    label: Email
    type: string
  - name: resume
    label: Résumé (PDF)
    type: file
    description: Upload a new PDF here to replace the one behind the Download Résumé button.
  - name: hidden_pages
    label: Hide whole pages
    type: select
    description: Selected pages disappear from the menu and the site. Hiding Design also hides every project page. Art & Craft and Tools also stay hidden automatically until they have at least one item
      with content.
    options:
      multiple: true
      values:
      - name: about
        label: About
      - name: teaching
        label: Teaching
      - name: research
        label: Research
      - name: design
        label: Design
      - name: art
        label: Art & Craft
      - name: tools
        label: Tools
  - name: profiles
    label: Profile links (home page and footer)
    type: object
    list: true
    fields:
    - name: label
      label: Name
      type: string
    - name: url
      label: Link
      type: string
    - name: hidden
      label: Hide on the website
      type: boolean
      description: Keeps this item saved here but removes it from the site.
