positions:
- title: Assistant Professor, Communication Design Department
  place: Pearl Academy, Delhi-West, India
  dates: August 2026 – Present
  intro: As an Assistant Professor at Pearl Academy (Delhi), I have conducted classes for B.Des. and M.Des. students on the following courses.
  groups:
  - label: ''
    courses:
    - code: CACDU5TPE375
      title: Data Visualization
      info: 3 Credits · UG & PG (Elective Course, Class strength 20)
      points:
      - The course provided students with the necessary techniques for analysing various data types and translating them into informative, compelling, and interactive visualizations.
      - Students learned how to apply various visual encoders to effectively convey complex information to diverse audiences, recognizing how design choices are influenced by context and culture.
      - They also implemented interactive softwares and Gen-AI based applications to explore innovative approaches to data visualization in digital media.
    - code: CACDP3THM601
      title: Context Setting
      info: 3 Credits · PG (Compulsory Course, Class strength 20)
      points:
      - The objective of this course was to enhance students' comprehension of diverse research methodologies, encompassing both quantitative and qualitative approaches, and to facilitate the practical application of these methodologies.
      - As a part of this course, students collected user data using various data collection methods, analyzed the data and discovered user needs and painpoints.
      - The outcomes of the research activity in this course was to be used for their major design project in the subsequent semester.
