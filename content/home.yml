lead: Hello, I am an artist, a visual and interaction designer, and a typography
  scholar.
about: My research interests span Indic typography, visual communication design,
  and early childhood education. My PhD research focused on Odia letterform
  studies, particularly on children's letterform comprehension and early writing
  pedagogy and assessment.
